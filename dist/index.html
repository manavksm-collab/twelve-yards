<style>
/* Layout: one screen. LED scoreboard on top, floodlit stadium canvas fills the rest; the question card docks over the pitch like a broadcast graphic, and the camera re-frames the goal around it. */
:root{
  --night:#08111f;     /* stadium sky */
  --deep:#0d1a2e;      /* panels */
  --chalk:#f3f6f0;     /* pitch-line white */
  --mist:#9fb0c6;      /* secondary text */
  --led:#ffb31a;       /* scoreboard amber */
  --you:#ff5b3a;       /* your kit */
  --rival:#3a8bff;     /* rival kit */
  --good:#3ddc84;      /* scored */
  --bad:#ff4d5e;       /* missed */
  --line:rgba(243,246,240,.14);
  --f-display:"Saira Extra Condensed","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-led:"Doto",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{background:var(--night)}
html{overflow:hidden}
body{margin:0;background:var(--night);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--led);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* scoreboard */
.board{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:#050b15;border-bottom:1px solid var(--line);
  padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.side{display:flex;flex-direction:column;gap:5px;min-width:0}
.side.r{align-items:flex-end}
.tname{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.side.l .tname{color:var(--you)}.side.r .tname{color:var(--rival)}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.side.r .pips{justify-content:flex-end}
.pip{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(243,246,240,.35);display:grid;place-items:center;font-size:9px;line-height:1;transition:transform .3s}
.pip.g{background:var(--good);border-color:var(--good)}
.pip.m{background:transparent;border-color:var(--bad);color:var(--bad)}
.pip.m::after{content:"✕";font-weight:700}
.pip.now{transform:scale(1.25);border-color:var(--led)}
.mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.score{font-family:var(--f-led);font-weight:900;font-size:34px;line-height:1;color:var(--led);text-shadow:0 0 12px rgba(255,179,26,.55);letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.rlabel{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mist);white-space:nowrap}
.icon-btn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#0b1626;display:grid;place-items:center;cursor:pointer;color:var(--chalk)}
.icon-btn:hover{border-color:var(--led)}
#bMute{right:max(14px,env(safe-area-inset-right,0px))}
.board.has-btn{padding-right:calc(max(14px,env(safe-area-inset-right,0px)) + 42px)}

/* stage */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}

/* broadcast banner */
.banner{position:absolute;left:0;right:0;top:16%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:4;padding-inline:16px;text-align:center;isolation:isolate}
.banner .burst{position:absolute;left:50%;top:40%;width:min(1100px,150vw);aspect-ratio:2/1;transform:translate(-50%,-50%);z-index:-1;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.24) 0deg 2.2deg,transparent 2.2deg 8deg);
  -webkit-mask:radial-gradient(ellipse at center,transparent 16%,#000 28%,transparent 68%);mask:radial-gradient(ellipse at center,transparent 16%,#000 28%,transparent 68%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.banner .sfx{position:absolute;top:-36%;right:max(3%,calc(50% - 460px));font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-size:clamp(34px,7vw,86px);line-height:1;color:#fff;
  -webkit-text-stroke:4px #0a0d16;paint-order:stroke fill;transform:rotate(12deg);text-shadow:5px 5px 0 #0a0d16}
.banner .sfx:empty{display:none}
.banner.show .sfx{animation:sfx .5s .06s cubic-bezier(.2,1.8,.4,1) both}
@keyframes sfx{0%{transform:rotate(32deg) scale(3);opacity:0}100%{transform:rotate(12deg) scale(1);opacity:1}}
.banner .big{font-family:var(--f-display);font-weight:900;font-style:normal;font-size:clamp(64px,13vw,150px);line-height:.85;letter-spacing:.01em;text-transform:uppercase;
  transform:skewX(-8deg);color:var(--chalk);-webkit-text-stroke:6px #0a0d16;paint-order:stroke fill;text-shadow:8px 8px 0 #0a0d16,0 0 60px currentColor}
.banner.goal .big{color:var(--good)}
.banner.miss .big{color:var(--bad)}
.banner.save .big{color:var(--led)}
.banner .sub{font-weight:600;font-size:clamp(14px,2.2vw,18px);background:rgba(5,11,21,.82);border:1px solid var(--line);padding:6px 12px;border-radius:4px;max-width:34em}
.banner .sub b{color:var(--good)}
.banner.show .big{animation:slam .55s cubic-bezier(.2,1.6,.4,1) both}
.banner.show .sub{animation:rise .4s .2s ease-out both}
@keyframes slam{0%{transform:skewX(-8deg) scale(2.4);opacity:0}100%{transform:skewX(-8deg) scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(10px);opacity:0}100%{transform:none;opacity:1}}

/* question card */
.card{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(780px,calc(100% - 24px));z-index:3;
  background:linear-gradient(180deg,rgba(13,26,46,.97),rgba(8,17,31,.97));border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.55);
  padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;transition:transform .35s cubic-bezier(.3,.9,.3,1),opacity .3s}
.card.away{transform:translate(-50%,120%);opacity:0;pointer-events:none}
.card .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:3px;background:#13243d;color:var(--mist);white-space:nowrap}
.chip.tier{background:var(--led);color:#1a1100}
.chip.tier.sd{background:var(--bad);color:#fff}
.timer{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--f-led);font-weight:900;font-size:22px;color:var(--chalk);font-variant-numeric:tabular-nums;line-height:1}
.timer.warn{color:var(--bad)}
.bar{height:5px;border-radius:3px;background:#13243d;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--good),var(--led));transform-origin:left;transition:background .3s}
.bar.warn i{background:var(--bad)}
.qtext{font-family:var(--f-body);font-weight:700;font-size:clamp(18px,2.6vw,24px);line-height:1.25;margin:0;text-wrap:balance}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{position:relative;text-align:left;min-height:54px;padding:10px 12px 10px 40px;border-radius:5px;border:1px solid rgba(243,246,240,.18);background:#102038;cursor:pointer;
  font-weight:600;font-size:15.5px;line-height:1.2;transition:transform .12s,border-color .15s,background .15s;touch-action:manipulation;min-width:0;overflow-wrap:anywhere}
.ans:hover:not(:disabled){border-color:var(--led);background:#16294a;transform:translateY(-1px)}
.ans .corner{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:20px;height:16px;border:2px solid rgba(243,246,240,.35);border-radius:2px}
.ans .corner::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--led)}
.ans[data-c="0"] .corner::after{left:1px;top:1px}.ans[data-c="1"] .corner::after{right:1px;top:1px}
.ans[data-c="2"] .corner::after{left:1px;bottom:1px}.ans[data-c="3"] .corner::after{right:1px;bottom:1px}
.ans .key{position:absolute;right:8px;top:6px;font-size:10px;color:var(--mist);font-weight:700;opacity:.7}
.ans:disabled{cursor:default}
.ans.picked{border-color:var(--led);background:#2a2410}
.ans.right{border-color:var(--good);background:#0f3324}
.ans.wrong{border-color:var(--bad);background:#3a1219}
.hint{font-size:12px;color:var(--mist);margin:0}

/* keeper picker */
.dive{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(560px,calc(100% - 24px));z-index:3;
  background:linear-gradient(180deg,rgba(13,26,46,.97),rgba(8,17,31,.97));border:1px solid var(--line);border-radius:6px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;
  transition:transform .35s cubic-bezier(.3,.9,.3,1),opacity .3s;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.dive.away{transform:translate(-50%,120%);opacity:0;pointer-events:none}
.dive h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.dive p{margin:0;color:var(--mist);font-size:13.5px}
.dive .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.dbtn{padding:14px 8px;border-radius:5px;border:1px solid rgba(243,246,240,.2);background:#102038;cursor:pointer;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:manipulation}
.dbtn span{font-size:22px;line-height:1}
.dbtn:hover:not(:disabled){border-color:var(--led);background:#16294a}
.dbtn.picked{border-color:var(--led);background:#2a2410}

/* modal screens */
.screen{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,11,21,.55),rgba(5,11,21,.88));
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto}
.panel{width:min(560px,100%);margin:auto;background:linear-gradient(180deg,rgba(13,26,46,.98),rgba(8,17,31,.98));border:1px solid var(--line);border-radius:8px;box-shadow:0 30px 80px rgba(0,0,0,.6);
  padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px}
.logo{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.logo .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--led);font-weight:700}
.logo h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(54px,12vw,84px);line-height:.82;letter-spacing:.005em;text-transform:uppercase;transform:skewX(-8deg);transform-origin:left}
.logo h1 em{font-style:normal;color:var(--led)}
.daily{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mist)}
.daily b{color:var(--chalk);font-weight:700}
.daily .vs{display:inline-flex;gap:6px;align-items:center}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;font-size:14.5px}
.rules .ic{width:36px;height:36px;border-radius:6px;background:#13243d;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px;color:var(--led)}
.rules b{display:block;font-weight:700;color:var(--chalk)}
.rules span{color:var(--mist)}
.ladder{display:flex;gap:4px;flex-wrap:wrap}
.ladder i{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:3px;background:#13243d;color:var(--mist)}
.ladder i:nth-child(5){background:var(--led);color:#1a1100}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#102038;border-radius:5px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
.btn:hover{border-color:var(--led)}
.btn.primary{background:var(--led);color:#1a1100;border-color:var(--led);flex:1;min-width:200px;font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;padding:12px 18px}
.btn.primary:hover{filter:brightness(1.08)}
.note{font-size:12px;color:var(--mist);margin:0}
.result-h{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(46px,10vw,70px);line-height:.85;text-transform:uppercase;transform:skewX(-8deg);transform-origin:left}
.result-h.win{color:var(--good)}.result-h.lose{color:var(--bad)}.result-h.draw{color:var(--led)}
.final{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.final .score{font-size:44px}
.final .teams{font-size:13px;color:var(--mist)}
.grid{font-family:ui-monospace,Menlo,Consolas,monospace;background:#081325;border:1px solid var(--line);border-radius:5px;padding:10px 12px;font-size:14px;line-height:1.6;white-space:pre;overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#0b1830;border-radius:5px;padding:8px 6px;text-align:center}
.stat b{display:block;font-family:var(--f-led);font-weight:900;font-size:24px;color:var(--led);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist)}
.next{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--mist);flex-wrap:wrap}
.next b{font-family:var(--f-led);font-weight:900;font-size:22px;color:var(--chalk);font-variant-numeric:tabular-nums}
details.review{border-top:1px solid var(--line);padding-top:10px}
details.review summary{cursor:pointer;font-weight:700;font-size:14px}
.rv{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:10px}
.rv li{font-size:13.5px;display:grid;gap:2px}
.rv .q{color:var(--chalk);font-weight:600}
.rv .a{color:var(--mist)}
.rv .ok{color:var(--good);font-weight:700}.rv .no{color:var(--bad);font-weight:700}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:9;background:var(--chalk);color:#08111f;font-weight:700;padding:8px 14px;border-radius:4px;font-size:14px;transition:opacity .3s}
.copybox{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#081325;color:var(--chalk);border:1px solid var(--line);border-radius:5px;padding:8px}

@media (max-width:560px){
  .banner .sfx{right:18px;top:-30%;font-size:30px;-webkit-text-stroke:3px #0a0d16;text-shadow:3px 3px 0 #0a0d16}
  .board{gap:6px}
  .tname{font-size:14px}
  .score{font-size:28px}
  .pip{width:11px;height:11px}
  .card{padding:12px 12px 12px;gap:10px;width:calc(100% - 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  .ans{min-height:52px;font-size:14.5px;padding:8px 8px 8px 36px}
  .ans .corner{left:8px}
  .ans .key{display:none}
  .hint{display:none}
  .dive{width:calc(100% - 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-height:620px) and (min-width:561px){ .hint{display:none} .card{gap:8px;padding:10px 14px} .ans{min-height:44px} }
@media (prefers-reduced-motion:reduce){ .banner.show .big,.banner.show .sub,.banner.show .sfx,.banner .burst{animation:none} .card,.dive{transition:opacity .2s} }
</style>
</head>
<body>


<div id="app">
  <header class="board has-btn" id="board">
    <div class="side l"><div class="tname" id="nYou">You</div><div class="pips" id="pYou" aria-label="Your kicks"></div></div>
    <div class="mid"><div class="score" id="score" aria-live="polite">0–0</div><div class="rlabel" id="rlabel">Daily shootout</div></div>
    <div class="side r"><div class="tname" id="nRival">Rival</div><div class="pips" id="pRival" aria-label="Rival kicks"></div></div>
    <button class="icon-btn" id="bMute" type="button" aria-label="Sound on" title="Sound (M)"></button>
  </header>
  <main class="stage" id="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="banner" id="banner" hidden><div class="burst" aria-hidden="true"></div><div class="sfx" id="bSfx" aria-hidden="true"></div><div class="big" id="bBig"></div><div class="sub" id="bSub" hidden></div></div>

    <section class="card away" id="card" aria-live="polite">
      <div class="top"><span class="chip tier" id="cTier">Warm-up</span><span class="chip" id="cCat">Science</span>
        <div class="timer" id="cTime"><span id="cSecs">25</span></div></div>
      <div class="bar" id="cBar"><i id="cBarI"></i></div>
      <h2 class="qtext" id="cQ">Question</h2>
      <div class="answers" id="cAns"></div>
      <p class="hint">Your answer is your shot. Each answer is a corner of the goal. Keys 1–4 work too.</p>
    </section>

    <section class="dive away" id="dive">
      <h3>You’re in goal</h3>
      <p id="dText">Read the rival’s kick. Pick a side before the timer runs out.</p>
      <div class="bar" id="dBar"><i id="dBarI"></i></div>
      <div class="row">
        <button class="dbtn" type="button" data-d="L" id="dL"><span>⟵</span>Dive left</button>
        <button class="dbtn" type="button" data-d="C" id="dC"><span>⤒</span>Stay up</button>
        <button class="dbtn" type="button" data-d="R" id="dR"><span>⟶</span>Dive right</button>
      </div>
    </section>

    <div class="screen" id="screen"></div>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>

<script id="qbank" type="text/plain">
#easy
Space|Which planet is known as the Red Planet?|Mars|Venus|Jupiter|Mercury
Maths|How many sides does a hexagon have?|6|5|7|8
Geography|What is the largest ocean on Earth?|Pacific|Atlantic|Indian|Arctic
Science|Which gas do plants take in from the air to make food?|Carbon dioxide|Oxygen|Nitrogen|Helium
Geography|What is the capital of Japan?|Tokyo|Osaka|Kyoto|Seoul
Sport|How many players does a football team have on the pitch?|11|10|12|9
Science|At what temperature does water freeze, in Celsius?|0 °C|32 °C|−10 °C|4 °C
Art|Who painted the Mona Lisa?|Leonardo da Vinci|Michelangelo|Raphael|Vincent van Gogh
Nature|What is the largest animal on Earth?|Blue whale|African elephant|Whale shark|Sperm whale
Geography|On which continent is most of Egypt?|Africa|Asia|Europe|Oceania
Geography|How many continents are there, by the most common count?|7|5|6|8
Music|How many keys does a standard modern piano have?|88|76|92|64
Geography|In which country are the Pyramids of Giza?|Egypt|Mexico|Peru|Sudan
Art|Which colour do you get by mixing blue and yellow paint?|Green|Purple|Orange|Brown
Maths|How many days are there in a leap year?|366|365|364|367
Nature|What is the tallest animal in the world?|Giraffe|African elephant|Ostrich|Camel

<script>

(()=>{ let tier=null; for(const raw of $('qbank').textContent.split('\n')){ const l=raw.trim(); if(!l) continue;
  if(l[0]==='#'){ tier=l.slice(1); continue; } const p=l.split('|'); if(p.length!==6||!BANK[tier]) continue;
  BANK[tier].push({cat:p[0],q:p[1],a:p[2],w:[p[3],p[4],p[5]]}); } })();

/* ============ seeded randomness ============ */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
const rngFor=(...k)=>mulberry(hashStr(k.join(':')));
function shuffle(arr,r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ============ daily schedule ============ */
const EPOCH=Date.UTC(2026,10,18); // puzzle #1
function today(){ const d=new Date(); return Math.max(1,Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-EPOCH)/864e5)+1); }
const ROUNDS=[ {tier:'easy',slot:0,label:'Warm-up'}, {tier:'medium',slot:0,label:'Club level'}, {tier:'hard',slot:0,label:'International'},
  {tier:'hard',slot:1,label:'World class'}, {tier:'expert',slot:0,label:'Legend'} ];
const SD=[ {tier:'expert',slot:1}, {tier:'hard',slot:2}, {tier:'expert',slot:2}, {tier:'hard',slot:3}, {tier:'expert',slot:3} ];
const PER={easy:1,medium:1,hard:4,expert:4};
const permCache={};
function pickQ(tier,slot,day){ const pool=BANK[tier], N=pool.length; const k=(day-1)*PER[tier]+slot; const cycle=Math.floor(k/N), pos=k%N;
  const key=tier+cycle; if(!permCache[key]) permCache[key]=shuffle([...Array(N).keys()],rngFor('perm',tier,cycle)); return pool[permCache[key][pos]]; }
const CLUBS=['Harbour Athletic','Ironvale United','Saltmarsh Rovers','Kestrel FC','Old Quarry Town','Lantern Street','Northgate Wanderers','Copperfield City','Riverside Albion','Thornbury Villa','Marble Arch Rangers','Foxhollow FC','Granite Bay','Westmoor Athletic','Silverline Town','Juniper Park','Blackwater Celtic','Highcliff United','Meadowlark FC','Port Elder'];
function buildMatch(day,practice){
  const seedDay=practice?day:day;
  const r=rngFor('club',seedDay); const rival=CLUBS[Math.floor(r()*CLUBS.length)];
  const qs=[];
  for(let i=0;i<10;i++){ const spec=i<5?ROUNDS[i]:SD[i-5]; let Q;
    if(practice){ const pr=rngFor('pq',day,i); const pool=BANK[spec.tier]; Q=pool[Math.floor(pr()*pool.length)]; }
    else Q=pickQ(spec.tier,spec.slot,day);
    const opts=shuffle([Q.a,...Q.w],rngFor('opts',day,i,practice?'p':'d'));
    qs.push({...Q,opts,label:i<5?spec.label:'Sudden death',sd:i>=5,tier:spec.tier}); }
  const rk=[]; for(let i=0;i<10;i++){ const rr=rngFor('rival',day,i,practice?'p':'d'); const x=rr();
    rk.push({dir:x<.4?'L':x<.8?'R':'C', high:rr()<.45, miss:rr()<.15, missType:['wide','over','post'][Math.floor(rr()*3)]}); }
  const kr=[]; for(let i=0;i<10;i++){ const rr=rngFor('you',day,i,practice?'p':'d'); kr.push({v:rr(),side:rr()}); }
  return {rival,qs,rk,kr};
}

    const side=tgt.x<500?-1:1; keeperP=diveKeeper(keeperPoseFor({x:side<0?282:718,y:200},side),.55);
    ballP=flyBall({x:tgt.x+side*20,y:GOAL.t-70,ground:GOAL.b-40},.6,{lift:120,endR:6});
    after=async()=>{ SFX.groan(); await tween(.4,e=>{ S.ball.y=lerp(GOAL.t-70,GOAL.t-130,e); S.ball.r=lerp(6,4,e); }); S.ball.show=false; };
  } else if(kind==='wide'){
    const side=tgt.x<500?-1:1; keeperP=diveKeeper(keeperPoseFor({x:side<0?282:718,y:322},side),.55);
    ballP=flyBall({x:side<0?GOAL.l-70:GOAL.r+70,y:tgt.y+8},.6,{lift:40,endR:7});
    after=async()=>{ SFX.groan(); await tween(.4,e=>{ S.ball.x+=side*4; S.ball.r=Math.max(4,S.ball.r-.1); }); S.ball.show=false; };
  } else { // weak: tame shot straight at the keeper
    keeperP=diveKeeper({x:500,hipY:STAND_HIP+10,rot:0,arm:.6,crouch:.7},.4);
    ballP=flyBall({x:500,y:GOAL.b-40,ground:GOAL.b+6},.75,{lift:-10,endR:11,spin:6});
    after=async()=>{ SFX.glove(); SFX.groan(); };
  }
  await Promise.all([keeperP,ballP]); calmFX(); if(kind==='goal'||kind==='saved') S.impact=Math.max(S.impact,.5); await after(); S.ball.hot=null;
}

/* ============ match state ============ */
let M=null; // {day, practice, data, you:[], rival:[], log:[], qStarted, done, result}
const goals=a=>a.filter(Boolean).length;
function newMatch(day,practice){ return {day,practice,you:[],rival:[],log:[],qStarted:false,done:false,result:null,startedAt:Date.now()}; }
function saveM(){ if(!M||M.practice) return; DB.days[M.day]={you:M.you,rival:M.rival,log:M.log,qStarted:M.qStarted,done:M.done,result:M.result}; store(DB); }
function decide(){ const y=M.you, r=M.rival, gy=goals(y), gr=goals(r);
  if(y.length<=5&&r.length<=5){ const yRem=5-y.length, rRem=5-r.length;
    if(gy+yRem<gr) return 'lose'; if(gr+rRem<gy) return 'win';
    if(y.length===5&&r.length===5) return gy===gr?null:(gy>gr?'win':'lose');
    return null; }
  if(y.length===r.length){ if(gy!==gr) return gy>gr?'win':'lose'; if(y.length>=10) return 'draw'; }
  return null; }

/* ============ UI helpers ============ */
function renderBoard(){
  const D=M.data; $('nRival').textContent=D.rival; $('nYou').textContent='You';
  const n=Math.max(5,Math.max(M.you.length,M.rival.length)+(M.you.length>=5?1:0));
  const pips=(arr,mine)=>{ let h=''; for(let i=0;i<n;i++){ const v=arr[i]; const cur=!M.done&&i===arr.length&&((mine&&M.you.length===M.rival.length)||(!mine&&M.you.length>M.rival.length));
    h+=`<span class="pip${v===true?' g':v===false?' m':''}${cur?' now':''}"></span>`; } return h; };
  $('pYou').innerHTML=pips(M.you,true); $('pRival').innerHTML=pips(M.rival,false);
  $('score').textContent=`${goals(M.you)}–${goals(M.rival)}`;
  const k=Math.max(M.you.length,M.rival.length);
  $('rlabel').textContent=M.done?'Full time':M.practice?`Practice · kick ${Math.min(k+1,10)}`:`#${M.day} · ${k<5?'Kick '+(Math.min(M.you.length,4)+1)+' of 5':'Sudden death'}`;
}
let bannerTimer=0;
function banner(text,cls,sub,sfx){ const b=$('banner'); b.className='banner '+cls; $('bBig').textContent=text; $('bSfx').textContent=sfx||''; const s=$('bSub'); if(sub){ s.innerHTML=sub; s.hidden=false; } else s.hidden=true;
  b.hidden=false; void b.offsetWidth; b.classList.add('show'); }
function hideBanner(){ $('banner').hidden=true; $('banner').classList.remove('show'); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(bannerTimer); bannerTimer=setTimeout(()=>t.hidden=true,1800); }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- question ---------- */
let answerResolve=null, qTimer=0;
function askQuestion(Q){
  return new Promise(res=>{
    $('cTier').textContent=Q.label; $('cTier').classList.toggle('sd',Q.sd); $('cCat').textContent=Q.cat; $('cQ').textContent=Q.q;
    const box=$('cAns'); box.innerHTML='';
    Q.opts.forEach((o,i)=>{ const b=document.createElement('button'); b.type='button'; b.className='ans'; b.dataset.c=i; b.id='ans'+i;
      b.innerHTML=`<span class="corner" aria-hidden="true"></span><span>${esc(o)}</span><span class="key" aria-hidden="true">${i+1}</span>`;
      b.setAttribute('aria-label',`${o}. Shoots ${['top left','top right','bottom left','bottom right'][i]}`);
      b.addEventListener('click',()=>finish(i)); box.appendChild(b); });
    const card=$('card'); card.classList.remove('away'); frameCamera(false);
    const T=25000, t0=performance.now(); let lastSec=26, done=false;
    const bar=$('cBarI'); bar.style.transform='scaleX(1)';
    function finish(i){ if(done) return; done=true; clearInterval(qTimer); answerResolve=null;
      const ms=Math.round(performance.now()-t0);
      [...box.children].forEach((b,j)=>{ b.disabled=true; if(j===i) b.classList.add('picked'); });
      if(i>=0) SFX.select(); res({idx:i,ms}); }
    answerResolve=finish;
    qTimer=setInterval(()=>{ const el=performance.now()-t0, left=Math.max(0,T-el), sec=Math.ceil(left/1000);
      bar.style.transform=`scaleX(${left/T})`; const warn=left<=5000; $('cBar').classList.toggle('warn',warn); $('cTime').classList.toggle('warn',warn);
      if(sec!==lastSec){ lastSec=sec; $('cSecs').textContent=sec; if(sec<=5&&sec>0) SFX.tick(sec<=3); }
      if(left<=0) finish(-1); },50);
    setTimeout(()=>{ const f=$('ans0'); if(f&&matchMedia('(pointer:fine)').matches) f.focus({preventScroll:true}); },60);
  });
}
function revealAnswer(Q,idx){ [...$('cAns').children].forEach((b,j)=>{ if(Q.opts[j]===Q.a) b.classList.add('right'); else if(j===idx) b.classList.add('wrong'); }); }
function hideCard(){ if($('card').contains(document.activeElement)) document.activeElement.blur(); $('card').classList.add('away'); frameCamera(false); }

/* ---------- dive ---------- */
let diveResolve=null;
function askDive(){ return new Promise(res=>{
  const d=$('dive'); [...d.querySelectorAll('.dbtn')].forEach(b=>{ b.disabled=false; b.classList.remove('picked'); });
  d.classList.remove('away'); frameCamera(false);
  const T=4000, t0=performance.now(); let done=false; const bar=$('dBarI');
  const finish=dir=>{ if(done) return; done=true; clearInterval(iv); diveResolve=null; [...d.querySelectorAll('.dbtn')].forEach(b=>{ b.disabled=true; if(b.dataset.d===dir) b.classList.add('picked'); }); if(dir!=='T') SFX.select(); setTimeout(()=>{ if(d.contains(document.activeElement)) document.activeElement.blur(); d.classList.add('away'); frameCamera(false); res(dir==='T'?'C':dir); },220); };
  diveResolve=finish;
  const iv=setInterval(()=>{ const left=Math.max(0,T-(performance.now()-t0)); bar.style.transform=`scaleX(${left/T})`; $('dBar').classList.toggle('warn',left<1500); if(left<=0) finish('T'); },40);
  setTimeout(()=>{ if(matchMedia('(pointer:fine)').matches) $('dC').focus({preventScroll:true}); },60);
}); }
['dL','dC','dR'].forEach(id=>$(id).addEventListener('click',e=>diveResolve&&diveResolve(e.currentTarget.dataset.d)));

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{ if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(answerResolve&&/^[1-4]$/.test(e.key)){ e.preventDefault(); answerResolve(+e.key-1); return; }
  if(diveResolve){ const m={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'C',ArrowDown:'C'}[e.key]; if(m){ e.preventDefault(); diveResolve(m); return; } }
  if(e.key==='m'||e.key==='M'){ audioInit(); setMuted(!AU.muted); } });

/* ============ flow ============ */
async function yourKick(){
  const i=M.you.length, Q=M.data.qs[i], kr=M.data.kr[i];
  resetScene('shoot'); renderBoard(); hideBanner(); SFX.murmur();
  M.qStarted=true; saveM();
  const {idx,ms}=await askQuestion(Q);
  const correct=idx>=0&&Q.opts[idx]===Q.a;
  M.qStarted=false;
  let kind; if(idx<0) kind='weak'; else if(correct) kind='goal'; else { const top=idx<2; kind=kr.v<.58?'saved':kr.v<.8?'post':(top?'over':'wide'); }
  M.you.push(correct); M.log.push({i,q:Q.q,a:Q.a,pick:idx>=0?Q.opts[idx]:null,ok:correct,ms:correct?ms:25000,label:Q.label}); saveM();
  revealAnswer(Q,idx);
  await wait(correct?450:900);
  hideCard(); await wait(250);
  if(kind==='goal') await cutIn(KIT.you,'集中'); else if(kind==='saved') await cutIn(KIT.gkRival,'読んだ');
  const saveSide=kr.side<.4?-1:kr.side<.8?1:0; const corner=idx<0?0:idx;
  const ks=(corner%2===0?-1:1); const decoySide=saveSide===ks?-ks:saveSide;
  await shootSequence(kind,corner,decoySide);
  const answerLine=correct?`<b>${esc(Q.a)}</b> · ${(ms/1000).toFixed(1)} s`:`Answer: <b>${esc(Q.a)}</b>`;
  if(kind==='goal') banner('Goal!','goal',answerLine,'ドンッ!!');
  else if(kind==='saved') banner('Saved!','miss',answerLine,'バシッ!');
  else if(kind==='post') banner('Off the post!','miss',answerLine,'カーン!!');
  else if(kind==='over') banner('Over the bar!','miss',answerLine,'スカッ…');
  else if(kind==='wide') banner('Wide!','miss',answerLine,'スカッ…');
  else banner('Too slow!','miss',`Time ran out. Answer: <b>${esc(Q.a)}</b>`,'ポテッ…');
  renderBoard();
  await wait(2100); hideBanner();
  return next();
}
async function rivalKick(){
  const i=M.rival.length, rk=M.data.rk[i];
  resetScene('keep'); renderBoard(); SFX.murmur();
  $('dText').textContent=`${M.data.rival} step up. Pick a side before the timer runs out.`;
  const choice=await askDive();
  const dirN={L:-1,C:0,R:1}[choice];
  const tgt=rk.dir==='C'?{x:500,y:rk.high?205:300}:{x:rk.dir==='L'?282:718,y:rk.high?200:322};
  const sameDir=choice===rk.dir;
  await cutIn(KIT.rival,'勝負');
  S.keeper.crouch=.45; SFX.hush(); await runUp(); SFX.kick(); S.taker.kick=1; impactKick('#38a6ff');
  let kind;
  if(rk.miss){ kind=rk.missType;
    const side=rk.dir==='L'?-1:rk.dir==='R'?1:(Math.random()<.5?-1:1);
    const kt=dirN===0?{x:500,y:230}:{x:dirN<0?282:718,y:tgt.y};
    const kp=diveKeeper(keeperPoseFor(kt,dirN),.5);
    if(kind==='wide'){ await Promise.all([kp,flyBall({x:side<0?GOAL.l-70:GOAL.r+70,y:tgt.y},.6,{lift:40,endR:7})]); S.ball.show=false; }
    else if(kind==='over'){ await Promise.all([kp,flyBall({x:500+side*150,y:GOAL.t-80,ground:GOAL.b-40},.6,{lift:120,endR:6})]); S.ball.show=false; }
    else { const px=side<0?GOAL.l:GOAL.r; await Promise.all([kp,flyBall({x:px-side*3,y:tgt.y},.55,{endR:9})]); SFX.post(); await flyBall({x:px+side*200,y:tgt.y+140,ground:GOAL.b+130},.6,{lift:20,endR:11}); }
    calmFX(); SFX.roar(.8); S.exciteT=.7;
    M.rival.push(false); banner(kind==='wide'?'Wide!':kind==='over'?'Over!':'Off the post!','save',`${esc(M.data.rival)} miss`,kind==='post'?'カーン!!':'スカッ!');
  } else if(sameDir){
    const kp=diveKeeper(keeperPoseFor(tgt,dirN),.48); await Promise.all([kp,flyBall(tgt,.55,{endR:9})]);
    calmFX(); S.impact=.75; SFX.glove(); SFX.roar(1); S.excite=1; S.exciteT=1; S.shake=.6; S.flash=.6;
    await flyBall({x:tgt.x+(dirN||1)*230,y:tgt.y+170,ground:GOAL.b+120},.5,{lift:30,endR:11,spin:-8});
    M.rival.push(false); banner('Saved!','save','What a stop','ガシッ!!');
  } else {
    const kt=dirN===0?{x:500,y:230}:{x:dirN<0?282:718,y:Math.random()<.5?200:322};
    const kp=diveKeeper(keeperPoseFor(kt,dirN),.55); await Promise.all([kp,flyBall(tgt,.55,{behind:true,endR:8})]);
    calmFX(); S.net={x:tgt.x,y:tgt.y,t:performance.now()/1000}; SFX.net(); SFX.groan(); S.shake=.3;
    await tween(.45,e=>{ S.ball.y=lerp(tgt.y,GOAL.b-28,e); },t=>t*t);
    M.rival.push(true); banner('Rival scores','miss',`${esc(M.data.rival)} go ${['left','down the middle','right'][{L:0,C:1,R:2}[rk.dir]]}`,'ズドン!');
  }
  saveM(); renderBoard();
  await wait(1900); hideBanner();
  return next();
}
async function next(){
  const r=decide();
  if(r){ return endMatch(r); }
  if(M.you.length===M.rival.length) return yourKick();
  return rivalKick();
}
function endMatch(r){
  M.done=true; M.result=r; renderBoard();
  if(!M.practice){ const st=DB.stats; if(!DB.days[M.day]||!DB.days[M.day].done){ st.played++; if(r==='win'){ st.wins++; st.streak=(st.lastDay===M.day-1&&st.lastWin)?st.streak+1:1; st.best=Math.max(st.best,st.streak); } else st.streak=0; st.lastDay=M.day; st.lastWin=r==='win'; } saveM(); }
  SFX.finalWhistle();
  if(r==='win'){ setTimeout(()=>{ SFX.roar(1.1); SFX.fanfare(); burstConfetti(); S.exciteT=1; },1500); }
  else if(r==='lose'){ setTimeout(()=>{ SFX.groan(); SFX.sad(); },1500); }
  setTimeout(()=>showResult(),reduce?900:2300);
}

/* ============ screens ============ */
function shareText(){ const yr=M.you.map(v=>v?'🟢':'🔴').join(''), rr=M.rival.map(v=>v?'🟢':'🔴').join('');
  const res=M.result==='win'?'Won':M.result==='lose'?'Lost':'Drew';
  return `Twelve Yards #${M.day} ⚽\n${res} ${goals(M.you)}–${goals(M.rival)} v ${M.data.rival}\nMe    ${yr}\nRival ${rr}`; }
function msToMidnight(){ const d=new Date(), n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1); return n-d; }
const fmtHMS=ms=>{ const s=Math.max(0,Math.floor(ms/1000)); return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':'); };
let cdTimer=0;
function showScreen(html){ const s=$('screen'); s.innerHTML=html; s.hidden=false; s.scrollTop=0; }
function hideScreen(){ $('screen').hidden=true; clearInterval(cdTimer); }
function showTitle(){
  const day=today(); const D=buildMatch(day,false); const rec=DB.days[day];
  const played=rec&&rec.done;
  showScreen(`<div class="panel" role="dialog" aria-labelledby="tt">
    <div class="logo"><div class="eyebrow">The daily penalty quiz</div><h1 id="tt">Twelve <em>Yards</em></h1></div>
    <div class="daily"><span>Shootout <b>#${day}</b></span><span>·</span><span class="vs">Today’s rival <b>${esc(D.rival)}</b></span></div>
    <ul class="rules">
      <li><div class="ic">◤◢</div><div><b>Your answer is your shot</b><span>Four answers, four corners of the goal. Right answer, the keeper goes the wrong way. Wrong answer, it’s saved or it misses.</span></div></li>
      <li><div class="ic">25</div><div><b>25 seconds a kick</b><span>Run out of time and you scuff it straight at the keeper. Questions get harder every round.</span></div></li>
      <li><div class="ic">GK</div><div><b>Then you’re in goal</b><span>Between your kicks, pick a side and try to save the rival’s penalty. Level after five each? Sudden death.</span></div></li>
    </ul>
    <div class="ladder" aria-label="Difficulty by round"><i>Warm-up</i><i>Club level</i><i>International</i><i>World class</i><i>Legend</i></div>
    <div class="actions">${played?`<button class="btn primary" id="bSeeRes" type="button">See today’s result</button>`:`<button class="btn primary" id="bPlay" type="button">${rec&&rec.you&&rec.you.length?'Resume shootout':'Take today’s shootout'}</button>`}
      <button class="btn" id="bPractice" type="button">Practice</button></div>
    <p class="note">One shootout a day, same questions for everyone. New one at midnight. Leaving mid-question counts as a miss.</p>
  </div>`);
  $('bPractice').onclick=()=>{ startMatch(true); };
  if(played) $('bSeeRes').onclick=()=>{ M=Object.assign(newMatch(day,false),rec,{data:D}); renderBoard(); showResult(); };
  else $('bPlay').onclick=()=>startMatch(false);
  setTimeout(()=>{ const b=$('bPlay')||$('bSeeRes'); b&&matchMedia('(pointer:fine)').matches&&b.focus({preventScroll:true}); },50);
}
function startMatch(practice){
  audioInit(); if(AU.ctx&&AU.ctx.state==='suspended') AU.ctx.resume();
  const day=practice?100000+Math.floor(Math.random()*900000):today();
  M=newMatch(day,practice); M.data=buildMatch(day,practice);
  if(!practice){ const rec=DB.days[day]; if(rec&&!rec.done){ Object.assign(M,{you:rec.you||[],rival:rec.rival||[],log:rec.log||[],qStarted:!!rec.qStarted});
      if(M.qStarted&&M.you.length===M.rival.length){ const Q=M.data.qs[M.you.length]; M.you.push(false); M.log.push({i:M.you.length-1,q:Q.q,a:Q.a,pick:null,ok:false,ms:25000,label:Q.label}); M.qStarted=false; saveM(); toast('Last kick counted as a miss'); } } }
  hideScreen(); renderBoard(); SFX.whistle(.5);
  setTimeout(()=>next(),reduce?200:700);
}
function showResult(){
  const r=M.result, st=DB.stats, gy=goals(M.you), gr=goals(M.rival);
  const title=r==='win'?'You win!':r==='lose'?'Beaten':'Shared spoils';
  const sub=r==='win'?`You beat ${esc(M.data.rival)} on penalties.`:r==='lose'?`${esc(M.data.rival)} edge it on penalties.`:'Level after ten kicks each.';
  const correct=M.log.filter(l=>l.ok).length;
  const review=M.log.map(l=>`<li><span class="q">${esc(l.label)} · ${esc(l.q)}</span><span class="a">${l.ok?'<span class="ok">✓</span>':'<span class="no">✕</span>'} ${l.pick?esc(l.pick):'No answer'}${l.ok?'':` · Answer: <b>${esc(l.a)}</b>`}</span></li>`).join('');
  showScreen(`<div class="panel" role="dialog" aria-labelledby="rt">
    <div class="logo"><div class="eyebrow">${M.practice?'Practice shootout':'Shootout #'+M.day}</div><h2 class="result-h ${r}" id="rt">${title}</h2></div>
    <div class="final"><div class="score">${gy}–${gr}</div><div class="teams">You v ${esc(M.data.rival)}<br>${correct} of ${M.log.length} questions right</div></div>
    <div class="grid" id="shareGrid">${esc(shareText())}</div>
    ${M.practice?'':`<div class="stats"><div class="stat"><b>${st.played}</b><span>Played</span></div><div class="stat"><b>${st.played?Math.round(st.wins/st.played*100):0}%</b><span>Win rate</span></div><div class="stat"><b>${st.streak}</b><span>Streak</span></div><div class="stat"><b>${st.best}</b><span>Best</span></div></div>`}
    <div class="actions">${M.practice?'':`<button class="btn primary" id="bShare" type="button">Copy result</button>`}<button class="btn${M.practice?' primary':''}" id="bAgain" type="button">${M.practice?'Practice again':'Practice'}</button>${M.practice?`<button class="btn" id="bHome" type="button">Back</button>`:''}</div>
    <div id="copyFallback"></div>
    ${M.practice?'':`<div class="next"><span>Next shootout in</span><b id="cd">${fmtHMS(msToMidnight())}</b></div>`}
    <details class="review"><summary>Review your kicks</summary><ul class="rv">${review}</ul></details>
  </div>`);
  $('bAgain').onclick=()=>startMatch(true);
  if($('bHome')) $('bHome').onclick=()=>showTitle();
  if($('bShare')) $('bShare').onclick=()=>{ const txt=shareText();
    const fallback=()=>{ $('copyFallback').innerHTML='<textarea class="copybox" id="copyText" readonly></textarea>'; const ta=$('copyText'); ta.value=txt; ta.focus(); ta.select(); toast('Select and copy the text'); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast('Result copied'),fallback); }catch(e){ fallback(); } };
  clearInterval(cdTimer); if($('cd')) cdTimer=setInterval(()=>{ const ms=msToMidnight(); $('cd').textContent=fmtHMS(ms); if(ms<1000){ clearInterval(cdTimer); setTimeout(showTitle,1500); } },1000);
}

/* ============ boot ============ */
setMuted(AU.muted);
resize(); resetScene('shoot');
M=newMatch(today(),false); M.data=buildMatch(today(),false);
const rec0=DB.days[M.day]; if(rec0) Object.assign(M,{you:rec0.you||[],rival:rec0.rival||[],done:!!rec0.done});
renderBoard();
showTitle();
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>frameCamera(true));
try{ document.fonts.load('40px "Dela Gothic One"','集中読んだ勝負'); }catch(e){}
})();
</script>
